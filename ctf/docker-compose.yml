# Faqat 4 ta web masala. Sayt va terminal: app/server.py (README.md).
# Ishga tushirish:  python3 build.py && docker compose --env-file .flags.env up -d --build
x-web: &web
  build: ./web
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  mem_limit: 128m
  pids_limit: 64

services:
  web-robots:
    <<: *web
    environment: { CHAL: robots, FLAG: "${FLAG_ROBOTS}", PORT: "8000" }
    ports: ["8001:8000"]
  web-cookie:
    <<: *web
    environment: { CHAL: cookie, FLAG: "${FLAG_COOKIE}", PORT: "8000" }
    ports: ["8002:8000"]
  web-sqli:
    <<: *web
    environment: { CHAL: sqli, FLAG: "${FLAG_SQLI}", PORT: "8000" }
    ports: ["8003:8000"]
  web-idor:
    <<: *web
    environment: { CHAL: idor, FLAG: "${FLAG_IDOR}", PORT: "8000" }
    ports: ["8004:8000"]
